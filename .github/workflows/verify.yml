name: Verify

on:
  workflow_dispatch:
    inputs:
      balance_suite:
        description: Balance coverage (full adds careers and card floors)
        type: choice
        default: quick
        options: [quick, full]
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Economy tests and headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Godot
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSLO "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          expected="$(grep -F "  Godot_v${GODOT_VERSION}_linux.x86_64.zip" SHA512-SUMS.txt)"
          test -n "${expected}" || { echo "checksum entry missing"; exit 1; }
          printf '%s\n' "${expected}" | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          echo "GODOT=${PWD}/godot" >> "$GITHUB_ENV"

      - name: Import project
        run: bash run_godot.sh --headless --path . --import

      - name: Tests
        run: bash run_tests.sh

      - name: Headless boot
        run: |
          output="$(bash run_godot.sh --headless --path . --quit 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'SCRIPT ERROR|Parse Error'; then
            echo "::error::Godot reported script or parse errors"
            exit 1
          fi

      - name: Balance impact (quick)
        run: python3 tools/balance_report.py compare --output /tmp/balance-quick.json --report /tmp/balance-quick.md

      - name: Balance impact (full, requested)
        if: github.event_name == 'workflow_dispatch' && inputs.balance_suite == 'full'
        run: python3 tools/balance_report.py compare --suite full --output /tmp/balance-full.json --report /tmp/balance-full.md

      - name: Show balance impact
        if: always()
        run: |
          for report in /tmp/balance-quick.md /tmp/balance-full.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Keep balance measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: balance-impact
          path: |
            /tmp/balance-quick.json
            /tmp/balance-quick.md
            /tmp/balance-full.json
            /tmp/balance-full.md
          if-no-files-found: ignore
